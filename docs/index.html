<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Full-Stack Interview Q&amp;A</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="Interview questions from basic to advanced: tell me about yourself, C#, .NET, Angular, JavaScript — with cross-questions and answers."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
  </head>
  <body>
    <div id="app">Loading interview notes…</div>
    <script>
      // Project Pages live at /interview-qa-docsify/; local Docsify uses /
      var pagesBase = '/interview-qa-docsify/';
      var onGitHubPages = /github\.io$/i.test(location.hostname);
      window.$docsify = {
        name: 'Interview Q&A',
        repo: '',
        basePath: onGitHubPages ? pagesBase : '/',
        nameLink: onGitHubPages ? pagesBase : '/',
        homepage: 'README.md',
        loadSidebar: true,
        loadNavbar: false,
        subMaxLevel: 3,
        auto2top: true,
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: 'Search questions…',
          noData: 'No matching question',
          depth: 4
        },
        alias: {
          '/.*/_sidebar.md': '/_sidebar.md'
        },
        pagination: {
          previousText: 'Previous',
          nextText: 'Next',
          crossChapter: true,
          crossChapterText: true
        }
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  </body>
</html>
